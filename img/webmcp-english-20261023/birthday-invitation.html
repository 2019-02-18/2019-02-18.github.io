<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alex&#39;s Birthday Picnic</title><style>*{box-sizing:border-box}body{margin:0;background:#faf5ec;color:#2f342b;font:16px/1.6 system-ui}main{max-width:730px;margin:auto;padding:48px 32px}.eyebrow{letter-spacing:.18em;font-size:12px;color:#e8762c;font-weight:700}h1{font-size:clamp(36px,6vw,62px);line-height:1.07;letter-spacing:-.04em}dl{display:flex;flex-wrap:wrap;gap:35px;padding:24px 0;border-block:1px solid #d7d6ca}dt{font-size:12px;text-transform:uppercase;color:#68715d}dd{margin:6px 0}label{display:block;margin:12px 0}input{display:block;padding:10px;width:100%;max-width:330px;font:inherit;border:1px solid #aaa;border-radius:6px}button{background:#e8762c;color:white;border:0;border-radius:6px;padding:12px 20px;font:inherit}output{display:block;margin-top:16px}small{color:#68715d}</style><main><p class="eyebrow">YOU ARE INVITED</p><h1>Alex&#39;s Birthday Picnic</h1><p>Grab a blanket and join us for cake, snacks and sunshine. We&#39;d love to celebrate with you!</p><dl><div><dt>When</dt><dd>October 31, 2026 at 2 PM</dd></div><div><dt>Where</dt><dd>Riverside Park</dd></div></dl><h2>Save me a slice</h2><form><label>Your name<input name="name" required maxlength="60"></label><label>Guests<input name="guests" type="number" min="1" max="20" value="1" required></label><button>RSVP</button><output aria-live="polite"></output></form><p><small>Local demo only. No invitation or registration is sent.</small></p></main><script>document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target);e.target.querySelector('output').textContent='Thanks, '+d.get('name')+'! '+d.get('guests')+' guest(s) recorded in this preview.'})</script></html>
