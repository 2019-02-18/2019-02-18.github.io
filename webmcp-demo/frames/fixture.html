<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebMCP frame fixture</title><style>body{font:14px/1.6 system-ui;margin:20px;background:#18181b;color:#fafafa}p{color:#a1a1aa}code{color:#34d399}</style><strong id="title"></strong><p id="status"></p><script type="module">
const label = new URLSearchParams(location.search).get('label') === 'B' ? 'B' : 'A'; document.getElementById('title').textContent = `Frame ${label} · frame_echo`;
const api = document.modelContext || navigator.modelContext;
if (api?.registerTool) { try { await api.registerTool({name:'frame_echo',description:`返回 frame ${label} 的身份。`,inputSchema:{type:'object',properties:{}},annotations:{readOnlyHint:true},execute:async()=>({frame:label})});document.getElementById('status').textContent='原生工具已注册。请从扩展选择此 frame。'; } catch(error) {document.getElementById('status').textContent=error.message} }
else document.getElementById('status').textContent='本地预览：没有原生 WebMCP API，未注册工具。';
</script></html>
